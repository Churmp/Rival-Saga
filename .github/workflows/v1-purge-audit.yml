name: V1 Purge Inspection

on:
  push:
    branches:
      - audit/purge-v1-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show current purge boundaries
        shell: bash
        run: |
          set -euo pipefail
          echo '===== APP VERSION CONTRACT ====='
          grep -n -C 12 -E 'ACTION_PHASE_VERSION_V1|ACTION_PHASE_VERSION_V2|activeActionPhaseVersion|supportedActionPhaseVersions|actionPhaseVersion' app.js || true
          echo '===== APP RENDER SWITCH ====='
          grep -n -C 30 -F 'function renderActionPhase()' app.js || true
          echo '===== APP ENCOUNTER RUNTIME REFERENCES ====='
          grep -n -C 12 -E 'rivalSagaEncounterTokenRuntime|encounterTokenRuntime|encounterWheelDefinition|hiddenGrottoSessions' app.js || true
          echo '===== SERVER VERSION CONTRACT ====='
          grep -n -C 15 -E 'ACTION_PHASE_VERSION_V1|ACTION_PHASE_VERSION_V2|normalizeActionPhaseVersion|persistedActionPhaseVersion|actionPhaseVersion' server.js || true
          echo '===== INDEX ENCOUNTER UI ====='
          grep -n -C 10 -E 'Encounter Wheel|encounterOverlay|encounterTab|Hidden Grotto' index.html || true
          echo '===== PACKAGE V1-RELATED SCRIPTS ====='
          grep -n -C 4 -E 'action-phase|encounter|v2-route|v2-routes' package.json || true
