name: Route Runtime First Scenario

on:
  push:
    branches:
      - audit/purge-v1-runtime

jobs:
  route-runtime-first:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bridge Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/runtime-verify-bin"
          mkdir -p "$SHIM_BIN"
          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@" 2>>/tmp/rival-saga-chromium.log
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"
      - name: First Route runtime scenario
        shell: bash
        run: |
          timeout 90s node --test --test-name-pattern='V2 normal Route Action persists and remains exactly once through reload' scripts/test-v2-route-runtime-sequences.js
