name: Repair Route Runtime Readiness

on:
  push:
    branches:
      - audit/purge-v1-runtime

permissions:
  contents: write

jobs:
  repair-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair unsafe readiness checks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/test-v2-route-runtime-sequences.js';
          let text = fs.readFileSync(file, 'utf8');
          const from = 'typeof v2EnsureRouteSeriesState === "function" && state?.marker === ${JSON.stringify(marker)}';
          const to = 'typeof state !== "undefined" && typeof v2EnsureRouteSeriesState === "function" && state.marker === ${JSON.stringify(marker)}';
          const count = text.split(from).length - 1;
          if (count !== 2) throw new Error(`Expected exactly 2 unsafe readiness checks, found ${count}.`);
          text = text.split(from).join(to);
          if (text.includes(from)) throw new Error('Unsafe readiness expression survived replacement.');
          fs.writeFileSync(file, text);
          NODE
          node --check scripts/test-v2-route-runtime-sequences.js
          git diff --check
          git diff -- scripts/test-v2-route-runtime-sequences.js
      - name: Commit verifier repair
        shell: bash
        run: |
          git config user.name "Rival Saga Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/test-v2-route-runtime-sequences.js
          git commit -m "Make Route runtime readiness wait safe [skip ci]"
          git push origin HEAD:audit/purge-v1-runtime
      - name: Bridge Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/runtime-verify-bin"
          mkdir -p "$SHIM_BIN"
          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@" 2>>/tmp/rival-saga-chromium.log
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"
      - name: First Route runtime scenario
        shell: bash
        run: |
          timeout 90s node --test --test-name-pattern='V2 normal Route Action persists and remains exactly once through reload' scripts/test-v2-route-runtime-sequences.js
