name: Diagnose Route Runtime Boot

on:
  push:
    branches:
      - audit/purge-v1-runtime

jobs:
  diagnose-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add temporary browser diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/test-v2-route-runtime-sequences.js';
          let text = fs.readFileSync(file, 'utf8');
          const startupWait = 'async function waitForJson(url, timeoutMs = 10000) {';
          const relaxedStartupWait = 'async function waitForJson(url, timeoutMs = 30000) {';
          if ((text.split(startupWait).length - 1) !== 1) throw new Error('Expected one Chromium startup wait definition.');
          text = text.replace(startupWait, relaxedStartupWait);
          const readiness = 'typeof state !== "undefined" && typeof v2EnsureRouteSeriesState === "function" && state.marker === ${JSON.stringify(marker)}';
          const guarded = '(() => { try { return typeof v2EnsureRouteSeriesState === "function" && state.marker === ${JSON.stringify(marker)}; } catch { return false; } })()';
          const readinessCount = text.split(readiness).length - 1;
          if (readinessCount !== 2) throw new Error(`Expected 2 readiness expressions, found ${readinessCount}.`);
          text = text.split(readiness).join(guarded);
          const enableBlock = `  await Promise.all([\n    cdp.send("Page.enable"),\n    cdp.send("Runtime.enable")\n  ]);`;
          const diagnosticBlock = `${enableBlock}\n  cdp.on("Runtime.exceptionThrown", (params) => {\n    const details = params?.exceptionDetails || {};\n    const description = details.exception?.description || details.text || JSON.stringify(details);\n    console.error("BROWSER_EXCEPTION", description);\n  });`;
          if ((text.split(enableBlock).length - 1) !== 1) throw new Error('Runtime enable block was not unique.');
          text = text.replace(enableBlock, diagnosticBlock);
          text = text.replace('async function waitUntil(expression, timeoutMs = 30000) {', 'async function waitUntil(expression, timeoutMs = 30000) {\n  timeoutMs = Math.min(timeoutMs, 15000);');
          fs.writeFileSync(file, text);
          NODE
          node --check scripts/test-v2-route-runtime-sequences.js
      - name: Bridge Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/runtime-verify-bin"
          mkdir -p "$SHIM_BIN"
          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@" 2>>/tmp/rival-saga-chromium.log
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"
      - name: Diagnose first Route runtime scenario
        shell: bash
        run: |
          set +e
          timeout 75s node --test --test-name-pattern='V2 normal Route Action persists and remains exactly once through reload' scripts/test-v2-route-runtime-sequences.js
          code=$?
          echo "route_test_exit=$code"
          if [ -s /tmp/rival-saga-chromium.log ]; then
            echo '--- Chromium tail ---'
            tail -n 80 /tmp/rival-saga-chromium.log
            echo '--- end Chromium tail ---'
          fi
          exit "$code"
