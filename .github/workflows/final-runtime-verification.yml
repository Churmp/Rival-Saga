name: Focused Final Runtime Verification

on:
  push:
    branches:
      - audit/purge-v1-runtime

jobs:
  focused-final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bridge Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/runtime-verify-bin"
          mkdir -p "$SHIM_BIN"
          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@"
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"
      - name: Run focused final matrix
        shell: bash
        run: |
          set -euo pipefail
          echo '=== syntax: app.js ==='
          node --check app.js
          echo '=== syntax: server.js ==='
          node --check server.js
          echo '=== runtime boundary ==='
          npm run test:runtime-boundary
          echo '=== action operations ==='
          npm run test:action-operations
          echo '=== game shell ==='
          npm run test:game-shell
          echo '=== persistence ==='
          npm run test:persistence
          echo '=== provisional declarations ==='
          npm run test:provisional-declarations
          echo '=== token controller ==='
          npm run test:token-controller
          echo '=== token sandbox ==='
          npm run test:token-sandbox
          echo '=== route browser ==='
          npm run test:v2-route-browser
          echo '=== route runtime ==='
          npm run test:v2-route-runtime
          echo '=== route generation tests ==='
          npm run test:v2-routes
          echo '=== route generation audit ==='
          npm run audit:v2-routes
          echo '=== FOCUSED FINAL MATRIX PASS ==='
