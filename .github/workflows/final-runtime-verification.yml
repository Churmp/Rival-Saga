name: Fix Route Runtime Browser Process Tree

on:
  push:
    branches:
      - audit/purge-v1-runtime

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kill Chromium as a process tree
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/test-v2-route-runtime-sequences.js';
          let text = fs.readFileSync(file, 'utf8');

          const spawnFrom = '  ], { stdio: ["ignore", "ignore", "ignore"] });';
          const spawnTo = '  ], { stdio: ["ignore", "ignore", "ignore"], detached: process.platform !== "win32" });';
          if ((text.split(spawnFrom).length - 1) !== 1) throw new Error('Expected exactly one Chromium spawn options block.');
          text = text.replace(spawnFrom, spawnTo);

          const cleanupFrom = `after(async () => {\n  if (cdp) await cdp.close().catch(() => {});\n  if (browserProcess && !browserProcess.killed) browserProcess.kill();\n  if (browserProcess && browserProcess.exitCode === null) {\n    await Promise.race([\n      new Promise((resolve) => browserProcess.once("exit", resolve)),\n      delay(5000)\n    ]);\n  }\n  if (browserProcess && browserProcess.exitCode === null) {\n    browserProcess.kill("SIGKILL");\n    await Promise.race([\n      new Promise((resolve) => browserProcess.once("exit", resolve)),\n      delay(2000)\n    ]);\n  }`;
          const cleanupTo = `after(async () => {\n  if (cdp) await cdp.close().catch(() => {});\n  const killBrowserTree = (signal) => {\n    if (!browserProcess || browserProcess.exitCode !== null) return;\n    if (process.platform === "win32") {\n      browserProcess.kill(signal);\n      return;\n    }\n    try {\n      process.kill(-browserProcess.pid, signal);\n    } catch (error) {\n      if (error?.code !== "ESRCH") throw error;\n    }\n  };\n  killBrowserTree("SIGTERM");\n  if (browserProcess && browserProcess.exitCode === null) {\n    await Promise.race([\n      new Promise((resolve) => browserProcess.once("exit", resolve)),\n      delay(5000)\n    ]);\n  }\n  if (browserProcess && browserProcess.exitCode === null) {\n    killBrowserTree("SIGKILL");\n    await Promise.race([\n      new Promise((resolve) => browserProcess.once("exit", resolve)),\n      delay(2000)\n    ]);\n  }`;
          if ((text.split(cleanupFrom).length - 1) !== 1) throw new Error('Expected exactly one hardened Chromium cleanup prelude.');
          text = text.replace(cleanupFrom, cleanupTo);

          fs.writeFileSync(file, text);
          NODE
          node --check scripts/test-v2-route-runtime-sequences.js
          git diff --check
          git diff -- scripts/test-v2-route-runtime-sequences.js
      - name: Commit process-tree harness repair
        shell: bash
        run: |
          git config user.name "Rival Saga Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/test-v2-route-runtime-sequences.js
          git commit -m "Terminate Route runtime browser process tree [skip ci]"
          git push origin HEAD:audit/purge-v1-runtime
      - name: Bridge Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/runtime-verify-bin"
          mkdir -p "$SHIM_BIN"
          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@" 2>>/tmp/rival-saga-chromium.log
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"
      - name: Recheck first Route runtime scenario
        shell: bash
        run: |
          set +e
          timeout 75s node --test --test-name-pattern='V2 normal Route Action persists and remains exactly once through reload' scripts/test-v2-route-runtime-sequences.js
          code=$?
          echo "route_test_exit=$code"
          if [ -s /tmp/rival-saga-chromium.log ]; then
            echo '--- Chromium tail ---'
            tail -n 60 /tmp/rival-saga-chromium.log
            echo '--- end Chromium tail ---'
          fi
          exit "$code"
