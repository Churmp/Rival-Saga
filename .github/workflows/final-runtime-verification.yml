name: Final Route Runtime Recheck

on:
  push:
    branches:
      - audit/purge-v1-runtime

jobs:
  route-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bridge Chromium for Route runtime QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium executable is installed on this runner." >&2
            exit 1
          fi
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/runtime-verify-bin"
          mkdir -p "$SHIM_BIN"
          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@" 2>>/tmp/rival-saga-chromium.log
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          test -e "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"

      - name: Route runtime
        run: npm run test:v2-route-runtime
