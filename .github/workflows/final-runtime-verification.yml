name: Harden Route Runtime Browser Harness

on:
  push:
    branches:
      - audit/purge-v1-runtime

permissions:
  contents: write

jobs:
  harden-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden Chromium startup and cleanup
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/test-v2-route-runtime-sequences.js';
          let text = fs.readFileSync(file, 'utf8');

          const startupFrom = 'async function waitForJson(url, timeoutMs = 10000) {';
          const startupTo = 'async function waitForJson(url, timeoutMs = 30000) {';
          if ((text.split(startupFrom).length - 1) !== 1) throw new Error('Expected exactly one Chromium startup timeout.');
          text = text.replace(startupFrom, startupTo);

          const cleanupFrom = `  if (browserProcess) {\n    await Promise.race([\n      new Promise((resolve) => browserProcess.once("exit", resolve)),\n      delay(1000)\n    ]);\n  }\n  if (browserProfile && fs.existsSync(browserProfile)) fs.rmSync(browserProfile, { recursive: true, force: true });\n  await stopTemporaryServer(server);`;
          const cleanupTo = `  if (browserProcess && browserProcess.exitCode === null) {\n    await Promise.race([\n      new Promise((resolve) => browserProcess.once("exit", resolve)),\n      delay(5000)\n    ]);\n  }\n  if (browserProcess && browserProcess.exitCode === null) {\n    browserProcess.kill("SIGKILL");\n    await Promise.race([\n      new Promise((resolve) => browserProcess.once("exit", resolve)),\n      delay(2000)\n    ]);\n  }\n  try {\n    if (browserProfile && fs.existsSync(browserProfile)) {\n      fs.rmSync(browserProfile, { recursive: true, force: true, maxRetries: 10, retryDelay: 100 });\n    }\n  } finally {\n    await stopTemporaryServer(server);\n  }`;
          if ((text.split(cleanupFrom).length - 1) !== 1) throw new Error('Expected exactly one Chromium cleanup block.');
          text = text.replace(cleanupFrom, cleanupTo);
          fs.writeFileSync(file, text);
          NODE
          node --check scripts/test-v2-route-runtime-sequences.js
          git diff --check
      - name: Commit test harness repair
        shell: bash
        run: |
          git config user.name "Rival Saga Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/test-v2-route-runtime-sequences.js
          git commit -m "Harden Route runtime browser harness [skip ci]"
          git push origin HEAD:audit/purge-v1-runtime
      - name: Bridge Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/runtime-verify-bin"
          mkdir -p "$SHIM_BIN"
          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@" 2>>/tmp/rival-saga-chromium.log
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"
      - name: Recheck first Route runtime scenario
        shell: bash
        run: |
          set +e
          timeout 75s node --test --test-name-pattern='V2 normal Route Action persists and remains exactly once through reload' scripts/test-v2-route-runtime-sequences.js
          code=$?
          echo "route_test_exit=$code"
          if [ -s /tmp/rival-saga-chromium.log ]; then
            echo '--- Chromium tail ---'
            tail -n 60 /tmp/rival-saga-chromium.log
            echo '--- end Chromium tail ---'
          fi
          exit "$code"
