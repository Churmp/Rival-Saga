name: V1 Purge Autopilot

on:
  push:
    branches:
      - audit/purge-v1-runtime
    paths:
      - scripts/v1-purge-autopilot-command.txt

permissions:
  contents: write

concurrency:
  group: v1-purge-autopilot
  cancel-in-progress: true

jobs:
  run-purge-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out purge branch
        uses: actions/checkout@v4
        with:
          ref: audit/purge-v1-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: v1-purge-node22-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save installed dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.node-modules-cache.outputs.cache-primary-key }}

      - name: Configure purge commit identity
        run: |
          git config user.name "Rival Saga Purge Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Bridge Chromium for Route runtime QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium executable is installed on this runner." >&2
            exit 1
          fi

          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          SHIM_BIN="$RUNNER_TEMP/v1-purge-bin"
          mkdir -p "$SHIM_BIN"

          cat > "$SHIM_BIN/$WIN_CHROME" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME" --disable-dev-shm-usage "\$@" 2>>/tmp/rival-saga-chromium.log
          EOF
          chmod +x "$SHIM_BIN/$WIN_CHROME"

          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$SHIM_BIN/$WIN_CHROME" "$WIN_CHROME"
          test -x "$SHIM_BIN/$WIN_CHROME"
          test -e "$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"
          echo "Chromium QA shim -> $CHROME"

      - name: Run requested fail-closed purge stage
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(head -n 1 scripts/v1-purge-autopilot-command.txt | tr -d '\r')"
          case "$STAGE" in
            scripts/v1-purge-stage*.js) ;;
            *) echo "Refusing unexpected autopilot command: $STAGE" >&2; exit 1 ;;
          esac
          test -f "$STAGE"
          echo "Running $STAGE"
          if ! node "$STAGE"; then
            if [ -s /tmp/rival-saga-chromium.log ]; then
              echo "--- Chromium diagnostic tail ---" >&2
              tail -n 80 /tmp/rival-saga-chromium.log >&2
              echo "--- end Chromium diagnostic tail ---" >&2
            fi
            exit 1
          fi
