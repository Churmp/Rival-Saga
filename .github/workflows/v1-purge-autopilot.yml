name: V1 Purge Autopilot

on:
  push:
    branches:
      - audit/purge-v1-runtime
    paths:
      - scripts/v1-purge-autopilot-command.txt

permissions:
  contents: write

concurrency:
  group: v1-purge-autopilot
  cancel-in-progress: false

jobs:
  run-purge-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out purge branch
        uses: actions/checkout@v4
        with:
          ref: audit/purge-v1-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: v1-purge-node22-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          save-always: true

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Configure purge commit identity
        run: |
          git config user.name "Rival Saga Purge Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Bridge Chromium for Route runtime QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium executable is installed on this runner." >&2
            exit 1
          fi
          WIN_CHROME='C:\Program Files\Google\Chrome\Application\chrome.exe'
          printf '%s\n' 'C:*chrome.exe' >> .git/info/exclude
          ln -sf "$CHROME" "$WIN_CHROME"
          test -e "$WIN_CHROME"
          SHIM_BIN="$RUNNER_TEMP/v1-purge-bin"
          mkdir -p "$SHIM_BIN"
          ln -sf "$CHROME" "$SHIM_BIN/$WIN_CHROME"
          echo "$SHIM_BIN" >> "$GITHUB_PATH"

      - name: Run requested fail-closed purge stage
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(head -n 1 scripts/v1-purge-autopilot-command.txt | tr -d '\r')"
          case "$STAGE" in
            scripts/v1-purge-stage*.js) ;;
            *) echo "Refusing unexpected autopilot command: $STAGE" >&2; exit 1 ;;
          esac
          test -f "$STAGE"
          echo "Running $STAGE"
          node "$STAGE"
