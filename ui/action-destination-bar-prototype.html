<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rival Saga Action Destination Bar</title>
<style>
:root{
  --bg:#04130d;--bg2:#071b12;--ink:#f3f1df;--muted:#8ea99a;
  --green:#42c873;--green2:#1b7046;--gold:#d8c568;--line:rgba(216,197,104,.24);
  --slot:rgba(8,35,23,.93);--slot2:rgba(5,27,18,.93);
}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 55% 10%,#0b2b1c 0,#06180f 45%,#03100b 100%);font-family:Inter,Arial,sans-serif;color:var(--ink)}
body{padding:28px 24px;min-height:100vh}
.action-nav{width:min(95vw,1740px);margin:0 auto;position:relative}
.topline{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 4px;color:var(--muted);font-weight:800;font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.topline .title{color:var(--gold)}.topline .hud{letter-spacing:.07em}.topline .hud strong{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:42px 42px;gap:5px 5px;position:relative}
.slot{position:relative;border:0;min-width:0;height:42px;padding:0 24px 0 25px;display:flex;align-items:center;gap:11px;color:var(--ink);background:linear-gradient(90deg,var(--slot),var(--slot2));clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);cursor:pointer;font:inherit;text-align:left;isolation:isolate;transition:background .12s,color .12s,filter .12s}
.slot::before{content:"";position:absolute;inset:0;clip-path:inherit;background:linear-gradient(90deg,rgba(216,197,104,.38),rgba(216,197,104,.12) 38%,transparent 76%);z-index:-2}
.slot::after{content:"";position:absolute;inset:1px 2px;clip-path:inherit;background:linear-gradient(90deg,var(--slot),var(--slot2));z-index:-1}
.slot:hover{filter:brightness(1.15)}
.slot.selected{color:#04130a;filter:none}
.slot.selected::before{background:linear-gradient(90deg,var(--gold),var(--green) 28%,var(--green))}
.slot.selected::after{background:linear-gradient(90deg,#d7ca78 0 12%,#4bd57c 12% 100%)}
.slot .num{font-size:11px;font-weight:950;letter-spacing:.02em;color:var(--gold);width:20px;text-align:right;flex:none}
.slot.selected .num{color:#0a2d18}
.slot .mark{height:22px;min-width:28px;padding:0 6px;display:grid;place-items:center;font-size:10px;font-weight:950;color:var(--gold);background:rgba(216,197,104,.08);border-left:2px solid var(--gold);transform:skewX(-10deg);flex:none}
.slot.selected .mark{background:rgba(7,38,20,.13);color:#082915;border-color:#082915}
.slot .name{font-size:12px;font-weight:950;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .tiny{margin-left:auto;width:20px;height:2px;background:rgba(216,197,104,.28);flex:none}
.slot.selected .tiny{background:rgba(4,38,18,.4)}
.s1{grid-row:1;grid-column:2/span 2}.s2{grid-row:1;grid-column:4/span 2}.s3{grid-row:1;grid-column:6/span 2}.s4{grid-row:1;grid-column:8/span 2}
.s5{grid-row:2;grid-column:1/span 2}.s6{grid-row:2;grid-column:3/span 2}.s7{grid-row:2;grid-column:5/span 2}.s8{grid-row:2;grid-column:7/span 2}.s9{grid-row:2;grid-column:9/span 2;visibility:hidden;pointer-events:none}
.baseline{height:1px;background:linear-gradient(90deg,transparent 0,var(--line) 8%,var(--line) 92%,transparent 100%);margin-top:6px}
.note{width:min(95vw,1740px);margin:36px auto 0;color:#749182;font-size:12px;text-align:center}
@media(max-width:1050px){.slot{padding-inline:15px;gap:7px}.slot .mark{display:none}.slot .name{font-size:10px}.topline{font-size:9px}}
</style></head>
<body>
<div class="action-nav">
  <div class="topline"><span class="title">Action Destinations</span><span class="hud"><strong>Steevee</strong> · 3/3 Actions · 5 Players</span></div>
  <div class="grid">
    <button class="slot s1 selected"><span class="num">01</span><span class="mark">RT</span><span class="name">Routes</span><span class="tiny"></span></button>
    <button class="slot s2"><span class="num">02</span><span class="mark">BF</span><span class="name">Battle Frontier</span><span class="tiny"></span></button>
    <button class="slot s3"><span class="num">03</span><span class="mark">DS</span><span class="name">Department Store</span><span class="tiny"></span></button>
    <button class="slot s4"><span class="num">04</span><span class="mark">GC</span><span class="name">Game Corner</span><span class="tiny"></span></button>
    <button class="slot s5"><span class="num">05</span><span class="mark">GY</span><span class="name">Graveyard</span><span class="tiny"></span></button>
    <button class="slot s6"><span class="num">06</span><span class="mark">RB</span><span class="name">Ranger Base</span><span class="tiny"></span></button>
    <button class="slot s7"><span class="num">07</span><span class="mark">PC</span><span class="name">Pokémon Center</span><span class="tiny"></span></button>
    <button class="slot s8"><span class="num">08</span><span class="mark">BB</span><span class="name">Bulletin Board</span><span class="tiny"></span></button>
    <button class="slot s9"><span class="num">09</span><span class="mark">+</span><span class="name">Bonus</span><span class="tiny"></span></button>
  </div>
  <div class="baseline"></div>
</div>
<div class="note">Slot 9 is geometrically reserved but hidden in the standard state.</div>
<script>document.querySelectorAll('.slot:not(.s9)').forEach(b=>b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})</script>
</body></html>
